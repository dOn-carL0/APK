name: Android APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Paketleri yukle ve Android projesini olustur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Olusan APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: vizyon-depo-raf-plani-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
